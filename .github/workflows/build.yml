name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu C++ build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libglfw3-dev \
            libglew-dev \
            libglm-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Check density model training
        run: python3 ml/train_model.py --check

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test hydrogen sampling and zoom
        run: ctest --test-dir build --output-on-failure

      - name: Render overview and close-up smoke tests
        run: |
          cd /tmp
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GITHUB_WORKSPACE/build/Electron_Simulation" --smoke-test "$GITHUB_WORKSPACE/build/captures"

      - name: Save rendered views
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-zoom-captures
          path: build/captures
